# ipcheck CLI 的质量门。
#
# 与 web.yml 的 paths 互不重叠，唯一的例外是 docs/verdict-cases.json——那是判级契约的
# 可执行形式，两端共吃同一份文件，改它必须两侧同时验证（docs/verdict.md 第 7 节）。
#
# 发布走 tag `cli/v*`，由 dist 生成的 workflow 负责，与本文件零交集。
#
# paths 在 push 与 pull_request 下重复了一遍：GitHub Actions 不支持 YAML 锚点，
# 这里的重复是被迫的，改一处必须改两处。

name: cli

on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs/verdict-cases.json"
      - ".github/workflows/cli.yml"
  pull_request:
    paths:
      - "cli/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs/verdict-cases.json"
      - ".github/workflows/cli.yml"

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
