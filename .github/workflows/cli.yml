# Preflight CLI 的质量门。
#
# 与 web.yml 的 paths 互不重叠，例外是 docs/ 下两份两端共吃的数据文件：
# - docs/verdict-cases.json——判级契约的可执行形式，改它必须两侧同时验证（docs/verdict.md 第 7 节）
# - docs/country-codes.json——O5 判定用的国家名 → ISO2 映射，CLI 用 include_str! 编译期内联，
#   不列进来的话单独改它不触发 CLI 验证（docs/verdict.md 2.5）
#
# 发布走 tag `cli/v*`，由 dist 生成的 workflow 负责，与本文件零交集。
#
# paths 在 push 与 pull_request 下重复了一遍：GitHub Actions 不支持 YAML 锚点，
# 这里的重复是被迫的，改一处必须改两处。

name: cli

on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs/verdict-cases.json"
      - "docs/country-codes.json"
      - ".github/workflows/cli.yml"
  pull_request:
    paths:
      - "cli/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs/verdict-cases.json"
      - "docs/country-codes.json"
      - ".github/workflows/cli.yml"

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
