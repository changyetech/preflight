# ipcheck Web 的部署。
#
# 与 cli.yml 的 paths 互不重叠，唯一的例外是 docs/verdict-cases.json——判级契约的
# 可执行形式，两端共吃，改它必须两侧同时验证（docs/verdict.md 第 7 节）。
#
# **本仓库只有 CLI 发 GitHub Release**：安装命令用的 `releases/latest` 依赖这条约束，
# Web 走 Cloudflare 部署，不发 Release。
#
# 需要仓库 secret：CLOUDFLARE_API_TOKEN。

name: web

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "worker/**"
      - "public/**"
      - "index.html"
      - "en/**"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "wrangler.jsonc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "docs/verdict-cases.json"
      - ".github/workflows/web.yml"

concurrency:
  group: web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      # 测试要读 dist/client 里的真实产物（tests/i18n-routing.test.ts 依赖 env.ASSETS），
      # 所以必须排在 build 之后。
      - run: pnpm vitest run

      # 部署用的是**插件生成的** dist/ipcheck/wrangler.json，不是根目录那份输入配置——
      # 对根 wrangler.jsonc 直接 deploy 会绕过 Vite 产物、改用 wrangler 自己的打包。
      - name: Deploy
        run: pnpm exec wrangler deploy -c dist/ipcheck/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
