# 纯 workspace，不含 [package]——根目录是 Web 项目的家，Rust crate 隔离在 cli/ 下。
# 计划：docs/plans/2026-08-12-cli-rust-rewrite--foundation.md

[workspace]
members = ["cli"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.90"

# 多平台交叉编译与 Release 由 dist（原 cargo-dist）负责。
#
# ⚠️ 这份配置**尚未生效**：`tap` 指向的仓库还不存在，`dist init` 也还没跑过
#    （它才会生成 .github/workflows/*-release.yml）。前置条件见
#    docs/plans/2026-08-12-cli-rust-rewrite--release.md。
#
# tag 用**斜杠形式** `cli/v0.2.0`：dist 文档化的解析规则会忽略 `/` 之前非 package 名的
# 前缀，因此 tag 前缀与应用最终叫什么完全解耦——名字还没定，tag 却已经可以定了。
# 落地前必须用 `dist plan --tag=cli/v0.2.0` 实测确认。
[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = ["github"]
installers = ["shell", "powershell", "homebrew"]
tap = "OWNER/homebrew-tap"                      # TODO: 仓库 owner 未定
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
