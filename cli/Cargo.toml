# 应用名当前是**占位**：改名窗口在第一个 `cli/v*` tag 之前。
# 见 docs/plans/2026-08-12-cli-rust-rewrite.md「未决事项」。

[package]
name = "ipcheck"
version = "0.1.0"
description = "网络环境体检：出口 IP、DNS、代理、IP 风控、时区一致性与 Claude 端点"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "ipcheck"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
jiff = "0.2.35"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sys-locale = "0.3.2"
toml = "1.1.4"
ureq = { version = "3.4.0", default-features = false, features = ["rustls", "platform-verifier", "gzip", "json"] }
