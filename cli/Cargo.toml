# 应用名已定为 preflight（ADR-0017），改名窗口随第一个 `cli/v*` tag 关闭。
# `repository` / `homepage` 从 workspace 继承，dist 生成 installer URL 与 Homebrew
# formula 时都要读它们——去掉任何一个 `dist init` 都会报错或告警。

[package]
name = "preflight"
version = "0.3.0"
description = "网络环境体检：出口 IP、DNS、代理、IP 风控与时区一致性"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "preflight"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
# `string` 特性：`long_version` 需接受运行时构造的 String（版权行年份取当前年）。
clap = { version = "4.6.6", features = ["derive", "string"] }
jiff = "0.2.35"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sys-locale = "0.3.2"
simple-dns = "0.12"
# 报告宽度跟随窗口。手写 TIOCGWINSZ 要 unsafe 且覆盖不到 Windows 目标，
# 这个 crate 是 clap 自己也在用的那一份。
terminal_size = "0.4.4"
toml = "1.1.4"
ureq = { version = "3.4.0", default-features = false, features = ["rustls", "platform-verifier", "gzip", "json"] }
# 卸载时删除运行中的二进制自身：Unix 等价于 unlink，Windows 上处理
# 「运行中 exe 不能删自己」。uv / rye 同款，两平台一个代码路径。
self-replace = "1.5.0"
