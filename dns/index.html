<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Public DNS Servers · Preflight</title>
    <meta
      name="description"
      content="A curated list of public DNS resolvers — Cloudflare, Google, Quad9, AliDNS and more — with their region, filtering level, and whether they are operated from mainland China."
    />
    <link rel="canonical" href="https://preflight.omnikit.run/dns/" />
    <link rel="alternate" hreflang="en" href="https://preflight.omnikit.run/dns/" />
    <link rel="alternate" hreflang="zh-Hans" href="https://preflight.omnikit.run/zh-hans/dns/" />
    <link rel="alternate" hreflang="x-default" href="https://preflight.omnikit.run/dns/" />
    <script>
      (function () {
        var pref = null;
        try {
          pref = localStorage.getItem("preflight-theme");
        } catch (e) {}
        if (pref !== "light" && pref !== "dark") pref = "system";
        var dark =
          pref === "dark" ||
          (pref === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        var el = document.documentElement;
        el.setAttribute("data-theme-pref", pref);
        el.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
