<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Ascent 起飞：勾即起飞轨迹，尾段变绿 = 通过。简化层（加粗地平弧），规格见 docs/specs/2026-08-14-logo-redesign.md。
       favicon 跟随系统主题（prefers-color-scheme），站点 data-theme 管不到它，属预期行为。 -->
  <style>
    .b { stroke: oklch(50% 0.145 250); }
    .p { stroke: oklch(43% 0.11 155); }
    @media (prefers-color-scheme: dark) {
      .b { stroke: oklch(72% 0.13 248); }
      .p { stroke: oklch(80% 0.14 155); }
    }
  </style>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path class="b" opacity=".4" stroke-width="4.5" d="M7 47a27 27 0 0 1 50 0"/>
    <path class="b" stroke-width="9" d="M15 38l10 10"/>
    <path class="b" stroke-width="9" d="M25 48L52 15"/>
    <path class="p" stroke-width="9" d="M47 21.2L52 15"/>
  </g>
</svg>
