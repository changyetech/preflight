<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terms · Preflight</title>
    <meta
      name="description"
      content="Terms of use for Preflight: provided as is, best-effort signals rather than guarantees, and what counts as acceptable use."
    />
    <meta property="og:image" content="https://preflight.omnikit.run/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://preflight.omnikit.run/terms/" />
    <link
      rel="alternate"
      hreflang="en"
      href="https://preflight.omnikit.run/terms/"
    />
    <link
      rel="alternate"
      hreflang="zh-Hans"
      href="https://preflight.omnikit.run/zh-hans/terms/"
    />
    <link
      rel="alternate"
      hreflang="x-default"
      href="https://preflight.omnikit.run/terms/"
    />
    <script>
      (function () {
        var pref = null;
        try {
          pref = localStorage.getItem("preflight-theme");
        } catch (e) {}
        if (pref !== "light" && pref !== "dark") pref = "system";
        var dark =
          pref === "dark" ||
          (pref === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        var el = document.documentElement;
        el.setAttribute("data-theme-pref", pref);
        el.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
