<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preflight · 网络环境体检</title>
    <meta
      name="description"
      content="查看你的出口 IP 归属、系统时区一致性与 IPv6 泄露，使用对 IP 环境敏感的工具前先看清自己的网络环境。"
    />
    <link rel="canonical" href="https://preflight.omnikit.run/zh-hans" />
    <link rel="alternate" hreflang="en" href="https://preflight.omnikit.run/" />
    <link
      rel="alternate"
      hreflang="zh-Hans"
      href="https://preflight.omnikit.run/zh-hans"
    />
    <link
      rel="alternate"
      hreflang="x-default"
      href="https://preflight.omnikit.run/"
    />
    <!-- 防闪白：必须内联、必须在任何样式表加载/渲染前执行。读取 localStorage 里的主题偏好，
         立刻在 <html> 上打好 data-theme-pref（三态偏好）/ data-theme（二态生效值），
         CSS 只认后者，深色 token 不必再靠 prefers-color-scheme 驱动。
         localStorage 访问容错：隐私模式等场景下可能直接抛异常，不能让整页脚本挂掉。 -->
    <script>
      (function () {
        var pref = null;
        try {
          pref = localStorage.getItem("preflight-theme");
        } catch (e) {}
        if (pref !== "light" && pref !== "dark") pref = "system";
        var dark =
          pref === "dark" ||
          (pref === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        var el = document.documentElement;
        el.setAttribute("data-theme-pref", pref);
        el.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
